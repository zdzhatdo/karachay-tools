name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -v

  analyzer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f analyzer/Dockerfile -t krc-analyzer .
      - run: docker run --rm -v "$PWD/analyzer:/checks:ro" krc-analyzer bash /checks/smoke-test.sh
      - run: docker run --rm krc-analyzer apertium-regtest test
