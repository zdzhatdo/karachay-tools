name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pip install --no-deps -e .
      - run: pytest -v

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pip install --no-deps -e .
      - run: ruff check pipeline eval
      - run: ruff format --check pipeline eval
      - run: mypy pipeline eval

  analyzer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: docker build -f analyzer/Dockerfile -t krc-analyzer .
      - run: docker run --rm -v "$PWD/analyzer:/checks:ro" krc-analyzer bash /checks/smoke-test.sh
      - run: docker run --rm krc-analyzer apertium-regtest test
