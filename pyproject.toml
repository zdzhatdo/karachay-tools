[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "karachay-tools"
version = "0.1.0"
description = "Language infrastructure for Karachay-Balkar: corpus pipeline and analyzer tooling."
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = ["typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
krc-pipeline = "pipeline.cli:app"

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["eval", "pipeline"]
