[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "karachay-tools"
version = "0.1.0"
description = "Language infrastructure for Karachay-Balkar: corpus pipeline and analyzer tooling."
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = ["typer>=0.12", "mwparserfromhell>=0.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]
langid = ["fasttext-wheel>=0.9.2", "numpy<2"]

[project.scripts]
krc-pipeline = "pipeline.cli:app"

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["eval", "pipeline"]
