[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "karachay-tools"
version = "0.1.0"
description = "Language infrastructure for Karachay-Balkar: corpus pipeline and analyzer tooling."
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = ["typer>=0.12", "mwparserfromhell>=0.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17", "mypy>=2.4"]
langid = ["fasttext-wheel>=0.9.2", "numpy<3"]

[project.scripts]
krc-pipeline = "pipeline.cli:app"

[tool.setuptools]
packages = ["pipeline"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "PLE"]
ignore = [
    "B008",  # typer.Option(...) as a default is Typer's documented pattern
    "RUF001", "RUF002", "RUF003",  # Cyrillic letters that look Latin are deliberate in this project
]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["fasttext"]
ignore_missing_imports = true  # fastText ships no type information

[tool.pytest.ini_options]
testpaths = ["eval", "pipeline"]
